<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Raselny — قريبًا</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <main class="wrap">
    <section class="panel">
      <header class="top">
        <div class="brand"><div class="logo">R</div><span>Raselny</span></div>
        <div class="pill"><span class="pulse"></span> قيد التطوير</div>
      </header>
      <div class="hero">
        <div class="visual" aria-hidden="true">
          <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
          <div class="chat-card card-back"><div class="mini-head"><span class="mini-avatar"></span><span class="mini-lines"><i></i><i></i></span></div><div class="mini-bubble left"></div><div class="mini-bubble right"></div><div class="mini-bubble left short"></div></div>
          <div class="chat-card card-front"><div class="mini-head"><span class="mini-avatar blue"></span><span class="mini-lines"><i></i><i></i></span><span class="dots">•••</span></div><div class="mini-bubble left">أهلًا 👋</div><div class="mini-bubble right">قريبًا هنكون هنا!</div><div class="mini-bubble left short"></div><div class="typing"><b></b><b></b><b></b></div></div>
          <div class="spark spark-one">✦</div><div class="spark spark-two">✧</div>
        </div>
        <div class="copy">
          <div class="eyebrow"><span></span> بنبني تجربة جديدة</div>
          <h1>حاجة جميلة<br><em>بتتحضّر.</em></h1>
          <p>Raselny بيتبني دلوقتي. بنجهّز تجربة تواصل بسيطة، سريعة، ومختلفة — وهنكون جاهزين قريب.</p>
          <div class="progress-label"><span>مرحلة البناء</span><span class="status">جاري العمل</span></div>
          <div class="progress"><span></span></div>
          <div class="note"><span class="note-icon">✦</span> تابعنا، الإطلاق قريب.</div>
        </div>
      </div>
      <footer><span>© <span id="year"></span> Raselny</span><span class="footer-dot"></span><span>Made with care</span></footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
